<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="512" cy="512" r="420" fill="url(#nodeGlow)"/>

  <!-- neural graph: edges -->
  <g stroke="url(#edge)" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="512" y1="300" x2="340" y2="470"/>
    <line x1="512" y1="300" x2="684" y2="470"/>
    <line x1="340" y1="470" x2="420" y2="700"/>
    <line x1="684" y1="470" x2="604" y2="700"/>
    <line x1="420" y1="700" x2="604" y2="700"/>
    <line x1="340" y1="470" x2="684" y2="470"/>
    <line x1="512" y1="300" x2="512" y2="512"/>
    <line x1="512" y1="512" x2="420" y2="700"/>
    <line x1="512" y1="512" x2="604" y2="700"/>
  </g>

  <!-- neural graph: nodes -->
  <circle cx="512" cy="300" r="46" fill="#00F0FF"/>
  <circle cx="340" cy="470" r="34" fill="#2979FF"/>
  <circle cx="684" cy="470" r="34" fill="#2979FF"/>
  <circle cx="512" cy="512" r="30" fill="#F4B942"/>
  <circle cx="420" cy="700" r="38" fill="#00E676"/>
  <circle cx="604" cy="700" r="38" fill="#00E676"/>
</svg>
