name: learn_ai
description: Learn AI — From Machine Learning to Agentic AI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
  assets:
    - assets/fonts/
    - assets/content/
    - assets/content/python/
    - assets/content/sql/
    - assets/content/math/
    - assets/content/ds/
    - assets/content/ml/
    - assets/content/dl/
    - assets/content/nlp/
    - assets/content/cv/
    - assets/content/transformers/
    - assets/content/hf/
    - assets/content/genai/
    - assets/content/llm/
    - assets/content/embeddings/
    - assets/content/rag/
    - assets/content/ft/
    - assets/content/agents/
    - assets/content/langgraph/
    - assets/content/mcp/
    - assets/content/mlops/
    - assets/content/llmops/
    - assets/content/evalsec/
    - assets/content/vectordb/
    - assets/content/inference/
    - assets/content/swe/
    - assets/content/appdev/
    - assets/content/cloud/
    - assets/content/enterprise/
    - assets/content/pytorch/
    - assets/content/llm_architecture/
    - assets/content/distributed/
    - assets/content/multimodal/
    - assets/content/advanced_agents/
    - assets/content/system_design/
    - assets/content/graphrag/
    - assets/content/ai_security/
    - assets/content/reasoning/
    - assets/content/advanced_math/
    - assets/content/ai_coding/
    - assets/content/research/
    - assets/content/prompt_engineering/
